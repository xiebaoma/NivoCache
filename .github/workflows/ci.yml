name: C++ contracts
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        config:
          - name: debug
            flags: -DCMAKE_BUILD_TYPE=Debug
          - name: release
            flags: -DCMAKE_BUILD_TYPE=Release -DNIVO_BUILD_BENCHMARKS=ON
          - name: asan
            flags: -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build ${{ matrix.config.flags }}
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - if: matrix.config.name == 'release'
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/nivo-install"
          cmake -S tests/consumer -B build/consumer -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/nivo-install"
          cmake --build build/consumer --parallel 2
          ctest --test-dir build/consumer --output-on-failure
  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_CXX_FLAGS=-fsanitize=thread -fno-omit-frame-pointer"
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
